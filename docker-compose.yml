services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: clustopher-ch
    ports:
      - "19000:9000"   # native protocol (offset: spillway-clickhouse-1 already holds 9000)
      - "18123:8123"   # http (offset: spillway-clickhouse-1 already holds 8123)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: clustopher
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 20

volumes:
  clickhouse-data:
